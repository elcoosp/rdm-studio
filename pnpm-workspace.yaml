packages:
  - apps/web
  - apps/site
  - apps/docs
  - packages/*


allowBuilds:
  '@swc/core': true
  esbuild: true

minimumReleaseAgeExclude:
  - "@types/react@19.3.1"
  - three-mesh-bvh@0.10.0
  - "@types/node@26.6.11"
  - lucide-react@1.81.0

overrides:
  "@tanstack/router-generator": 1.99.9
  # Oxide v0.18.0 is not on the npm registry: the TS packages resolve to the
  # local oxide checkout (../oxide, git repo) via overrides so `^0.18.0`
  # specifiers link locally. Rebuild dist/ there with
  # `pnpm --filter @oxide-fw/core|react|tailwind build` (tsdown) after
  # pulling oxide changes; dist/ is gitignored in the oxide repo.
  "@oxide-fw/core": "link:../oxide/packages/core"
  "@oxide-fw/react": "link:../oxide/packages/react"
  "@oxide-fw/tailwind": "link:../oxide/packages/tailwind"

patchedDependencies:
  vaul@1.1.2: patches/vaul@1.1.2.patch

permissions:
  '@tanstack/react-router':
    skills: true
  '@tanstack/router-core':
    skills: true
  tsdown:
    skills: true
