<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spectral Glass Cube</title>
<style>
  html,body{margin:0;height:100%;background:#fff;overflow:hidden}
  canvas{display:block;cursor:grab;touch-action:none}
  canvas:active{cursor:grabbing}
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0xffffff,1);
document.body.appendChild(renderer.domElement);

var cam = new THREE.OrthographicCamera(-1,1,1,-1,0.1,60);
cam.position.set(7,6,7.5);
cam.lookAt(0,0,0);
var scene = new THREE.Scene();
var ballScene = new THREE.Scene();

var rt = new THREE.WebGLRenderTarget(512,512,{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter});
var uTime = {value:0};
var uRes  = {value:new THREE.Vector2(1,1)};
var uTex  = {value:rt.texture};

var BALL_R = 1.38;
var ballMat = new THREE.ShaderMaterial({
  uniforms:{uTime:uTime, uR:{value:BALL_R}},
  vertexShader:[
    "varying vec3 vView, vCenter, vObj;",
    "void main(){",
    "  vObj = position;",
    "  vec4 mv = modelViewMatrix*vec4(position,1.0);",
    "  vView = mv.xyz;",
    "  vCenter = (modelViewMatrix*vec4(0.0,0.0,0.0,1.0)).xyz;",
    "  gl_Position = projectionMatrix*mv;",
    "}"
  ].join("\n"),
  fragmentShader:[
    "precision highp float;",
    "varying vec3 vView, vCenter, vObj;",
    "uniform float uTime, uR;",
    "vec3 ramp(float t){",
    "  vec3 c0=vec3(1.00,0.32,0.50), c1=vec3(1.00,0.58,0.18), c2=vec3(1.00,0.92,0.22),",
    "       c3=vec3(0.20,0.92,0.44), c4=vec3(0.12,0.84,1.00), c5=vec3(0.32,0.46,1.00), c6=vec3(0.76,0.48,1.00);",
    "  t = clamp(t,0.0,1.0)*6.0;",
    "  if(1.0>t) return mix(c0,c1,t);",
    "  if(2.0>t) return mix(c1,c2,t-1.0);",
    "  if(3.0>t) return mix(c2,c3,t-2.0);",
    "  if(4.0>t) return mix(c3,c4,t-3.0);",
    "  if(5.0>t) return mix(c4,c5,t-4.0);",
    "  return mix(c5,c6,t-5.0);",
    "}",
    "void main(){",
    "  vec2 q = (vView.xy - vCenter.xy)/uR;",
    "  vec3 p = vObj/uR;",
    "  float warp = 0.070*sin(p.x*3.0+p.y*2.0+uTime*0.7)",
    "             + 0.050*sin(p.y*4.0-p.z*3.0-uTime*0.6)",
    "             + 0.040*sin(p.z*5.0+p.x*2.0+uTime*0.9);",
    "  float d = length(q) + warp;",
    "  d -= 0.05*sin(uTime*1.1);",
    "  float t = d*1.05 + 0.08*sin(d*14.0 - uTime*1.6)*smoothstep(0.2,0.9,d);",
    "  vec3 col = ramp(t);",
    "  col = mix(col, ramp(fract(d*2.2 + 0.1 - uTime*0.03)), 0.22*smoothstep(0.3,0.9,d));",
    "  col = mix(col, vec3(1.0,0.96,0.94), 0.30*exp(-d*d*8.5)*(0.6+0.4*sin(uTime*2.0)));",
    "  float a = smoothstep(1.04,0.46,d)*0.98;",
    "  gl_FragColor = vec4(col*a, a);",
    "}"
  ].join("\n"),
  transparent:true, depthWrite:false, depthTest:false,
  blending:THREE.CustomBlending, blendEquation:THREE.AddEquation,
  blendSrc:THREE.OneFactor, blendDst:THREE.OneMinusSrcAlphaFactor
});
var ballGroup = new THREE.Group();
ballScene.add(ballGroup);
var ball = new THREE.Mesh(new THREE.SphereGeometry(BALL_R,64,48), ballMat);
ballGroup.add(ball);

function createFlatChamferedBox(x0, x1, y0, y1, z0, z1, b) {
  var verts = new Array();
  function quad(a, c, d, e) {
    verts.push(a.x,a.y,a.z, c.x,c.y,c.z, d.x,d.y,d.z, a.x,a.y,a.z, d.x,d.y,d.z, e.x,e.y,e.z);
  }
  function tri(a, c, d) {
    verts.push(a.x,a.y,a.z, c.x,c.y,c.z, d.x,d.y,d.z);
  }
  function V(x,y,z){ return new THREE.Vector3(x,y,z); }
  var ix0=x0+b, ix1=x1-b, iy0=y0+b, iy1=y1-b, iz0=z0+b, iz1=z1-b;
  quad(V(ix0,iy0,z1), V(ix1,iy0,z1), V(ix1,iy1,z1), V(ix0,iy1,z1));
  quad(V(ix1,iy0,z0), V(ix0,iy0,z0), V(ix0,iy1,z0), V(ix1,iy1,z0));
  quad(V(x1,iy0,iz1), V(x1,iy0,iz0), V(x1,iy1,iz0), V(x1,iy1,iz1));
  quad(V(x0,iy0,iz0), V(x0,iy0,iz1), V(x0,iy1,iz1), V(x0,iy1,iz0));
  quad(V(ix0,y1,iz1), V(ix1,y1,iz1), V(ix1,y1,iz0), V(ix0,y1,iz0));
  quad(V(ix0,y0,iz0), V(ix1,y0,iz0), V(ix1,y0,iz1), V(ix0,y0,iz1));
  quad(V(ix0,iy1,z1), V(ix1,iy1,z1), V(ix1,y1,iz1), V(ix0,y1,iz1));
  quad(V(ix0,y0,iz1), V(ix1,y0,iz1), V(ix1,iy0,z1), V(ix0,iy0,z1));
  quad(V(ix1,iy0,z1), V(x1,iy0,iz1), V(x1,iy1,iz1), V(ix1,iy1,z1));
  quad(V(x0,iy0,iz1), V(ix0,iy0,z1), V(ix0,iy1,z1), V(x0,iy1,iz1));
  quad(V(ix1,iy1,z0), V(ix0,iy1,z0), V(ix0,y1,iz0), V(ix1,y1,iz0));
  quad(V(ix1,y0,iz0), V(ix0,y0,iz0), V(ix0,iy0,z0), V(ix1,iy0,z0));
  quad(V(x1,iy0,iz0), V(ix1,iy0,z0), V(ix1,iy1,z0), V(x1,iy1,iz0));
  quad(V(ix0,iy0,z0), V(x0,iy0,iz0), V(x0,iy1,iz0), V(ix0,iy1,z0));
  quad(V(x1,iy1,iz1), V(x1,iy1,iz0), V(ix1,y1,iz0), V(ix1,y1,iz1));
  quad(V(x0,iy1,iz0), V(x0,iy1,iz1), V(ix0,y1,iz1), V(ix0,y1,iz0));
  quad(V(x1,y0,iz1), V(x1,y0,iz0), V(x1,iy0,iz0), V(x1,iy0,iz1));
  quad(V(x0,y0,iz0), V(x0,y0,iz1), V(x0,iy0,iz1), V(x0,iy0,iz0));
  tri(V(ix1,iy1,z1), V(x1,iy1,iz1), V(ix1,y1,iz1));
  tri(V(x0,iy1,iz1), V(ix0,iy1,z1), V(ix0,y1,iz1));
  tri(V(x1,iy0,iz1), V(ix1,iy0,z1), V(ix1,y0,iz1));
  tri(V(ix0,iy0,z1), V(x0,iy0,iz1), V(ix0,y0,iz1));
  tri(V(x1,iy1,iz0), V(ix1,iy1,z0), V(ix1,y1,iz0));
  tri(V(ix0,iy1,z0), V(x0,iy1,iz0), V(ix0,y1,iz0));
  tri(V(ix1,iy0,z0), V(x1,iy0,iz0), V(ix1,y0,iz0));
  tri(V(x0,iy0,iz0), V(ix0,iy0,z0), V(ix0,y0,iz0));

  var geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3));
  geo.computeVertexNormals();
  geo.computeBoundingBox();
  return geo;
}

// True 3D extruded slab with physically recessed V-grooves on +X and 45-deg chamfers
function createExtrudedGroovedSlab(x0, x1, y0, y1, z0, z1, b) {
  var verts = new Array();
  var cx = (x0 + x1) * 0.5, cy = (y0 + y1) * 0.5, cz = (z0 + z1) * 0.5;
  function tri(a, c, d) {
    var e1x = c.x - a.x, e1y = c.y - a.y, e1z = c.z - a.z;
    var e2x = d.x - a.x, e2y = d.y - a.y, e2z = d.z - a.z;
    var nx = e1y * e2z - e1z * e2y;
    var ny = e1z * e2x - e1x * e2z;
    var nz = e1x * e2y - e1y * e2x;
    var mx = (a.x + c.x + d.x) / 3 - cx;
    var my = (a.y + c.y + d.y) / 3 - cy;
    var mz = (a.z + c.z + d.z) / 3 - cz;
    if (0 > nx * mx + ny * my + nz * mz) {
      var tmp = c; c = d; d = tmp;
    }
    verts.push(a.x,a.y,a.z, c.x,c.y,c.z, d.x,d.y,d.z);
  }
  function quad(a, c, d, e) {
    tri(a, c, d);
    tri(a, d, e);
  }
  function V(x,y,z){ return new THREE.Vector3(x,y,z); }

  var ix0=x0+b, ix1=x1-b, iy0=y0+b, iy1=y1-b, iz0=z0+b, iz1=z1-b;
  var g1 = 0.34, g2 = -0.34, gw = 0.052, gd = 0.13;
  var gx = x1 - gd;

  var prof = new Array(
    V(x0, iy0, 0), V(ix0, y0, 0), V(ix1, y0, 0), V(x1, iy0, 0),
    V(x1, g2 - gw, 0), V(gx, g2, 0), V(x1, g2 + gw, 0),
    V(x1, g1 - gw, 0), V(gx, g1, 0), V(x1, g1 + gw, 0),
    V(x1, iy1, 0), V(ix1, y1, 0), V(ix0, y1, 0), V(x0, iy1, 0)
  );
  var inner = new Array(
    V(ix0, iy0, 0), V(ix0, iy0, 0), V(ix1, iy0, 0), V(x1, iy0, 0),
    V(x1, g2 - gw, 0), V(gx, g2, 0), V(x1, g2 + gw, 0),
    V(x1, g1 - gw, 0), V(gx, g1, 0), V(x1, g1 + gw, 0),
    V(x1, iy1, 0), V(ix1, iy1, 0), V(ix0, iy1, 0), V(ix0, iy1, 0)
  );

  for (var i = 0; prof.length > i; i++) {
    var j = (i + 1) % prof.length;
    var p0 = prof.at(i), p1 = prof.at(j);
    var q0 = inner.at(i), q1 = inner.at(j);
    if (Math.hypot(p1.x - p0.x, p1.y - p0.y) > 1e-5) {
      quad(V(p0.x, p0.y, iz1), V(p1.x, p1.y, iz1), V(p1.x, p1.y, iz0), V(p0.x, p0.y, iz0));
      if (Math.hypot(q0.x - p0.x, q0.y - p0.y) > 1e-5 || Math.hypot(q1.x - p1.x, q1.y - p1.y) > 1e-5) {
        quad(V(q0.x, q0.y, z1), V(q1.x, q1.y, z1), V(p1.x, p1.y, iz1), V(p0.x, p0.y, iz1));
        quad(V(p0.x, p0.y, iz0), V(p1.x, p1.y, iz0), V(q1.x, q1.y, z0), V(q0.x, q0.y, z0));
      }
    }
  }

  var bands = new Array(
    { yA: iy0, yB: g2 - gw },
    { yA: g2 + gw, yB: g1 - gw },
    { yA: g1 + gw, yB: iy1 }
  );
  for (var k = 0; bands.length > k; k++) {
    var bd = bands.at(k);
    quad(V(ix0, bd.yA, z1), V(x1, bd.yA, z1), V(x1, bd.yB, z1), V(ix0, bd.yB, z1));
    quad(V(x1, bd.yA, z0), V(ix0, bd.yA, z0), V(ix0, bd.yB, z0), V(x1, bd.yB, z0));
  }
  quad(V(ix0, g2 - gw, z1), V(x1, g2 - gw, z1), V(gx, g2, z1), V(ix0, g2, z1));
  quad(V(ix0, g2, z1), V(gx, g2, z1), V(x1, g2 + gw, z1), V(ix0, g2 + gw, z1));
  quad(V(ix0, g1 - gw, z1), V(x1, g1 - gw, z1), V(gx, g1, z1), V(ix0, g1, z1));
  quad(V(ix0, g1, z1), V(gx, g1, z1), V(x1, g1 + gw, z1), V(ix0, g1 + gw, z1));
  quad(V(x1, g2 - gw, z0), V(ix0, g2 - gw, z0), V(ix0, g2, z0), V(gx, g2, z0));
  quad(V(gx, g2, z0), V(ix0, g2, z0), V(ix0, g2 + gw, z0), V(x1, g2 + gw, z0));
  quad(V(x1, g1 - gw, z0), V(ix0, g1 - gw, z0), V(ix0, g1, z0), V(gx, g1, z0));
  quad(V(gx, g1, z0), V(ix0, g1, z0), V(ix0, g1 + gw, z0), V(x1, g1 + gw, z0));

  var geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3));
  geo.computeVertexNormals();
  geo.computeBoundingBox();
  return geo;
}
var VERT=[
  "varying vec3 vP, vNv, vNo;",
  "void main(){",
  "  vP = position; vNo = normalize(normal);",
  "  vNv = normalize(normalMatrix*normal);",
  "  gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);",
  "}"
].join("\n");

var FRAG=[
  "precision highp float;",
  "varying vec3 vP, vNv, vNo;",
  "uniform vec3 uMin, uMax; uniform float uFrost, uBack, uTime;",
  "uniform sampler2D uTex; uniform vec2 uRes;",
  "float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }",
  "void main(){",
  "  vec2 uv = gl_FragCoord.xy/uRes;",
  "  vec3 N  = normalize(vNv); if(!gl_FrontFacing) N = -N;",
  "  vec3 No = normalize(vNo); if(!gl_FrontFacing) No = -No;",
  "  vec3 absNo = abs(No);",
  "  float maxAxis = max(absNo.x, max(absNo.y, absNo.z));",
  "  float isBevel = smoothstep(0.95, 0.72, maxAxis);",
  "  vec2 refr = N.xy*(uBack>0.5 ? -0.024 : 0.048)",
  "            + 0.010*(1.0-uFrost)*vec2(sin(vP.y*7.0+uTime*0.6+N.x*3.0), cos(vP.z*6.0-uTime*0.5+N.y*3.0));",
  "  float rad = mix(0.006,0.068,uFrost);",
  "  vec2 asp = vec2(uRes.y/uRes.x,1.0);",
  "  float j = hash(gl_FragCoord.xy)*6.2832;",
  "  vec3 acc = vec3(0.0);",
  "  for(int i=0;14>i;i++){",
  "    float fi=float(i);",
  "    float r=sqrt((fi+0.5)/14.0)*rad;",
  "    float an=fi*2.399963+j;",
  "    acc += texture2D(uTex, uv+refr+vec2(cos(an),sin(an))*r*asp).rgb;",
  "  }",
  "  vec3 tex = acc/14.0;",
  "  vec2 dv = N.xy*0.038*(0.35 + 0.65*isBevel);",
  "  vec3 disp = vec3(texture2D(uTex,uv+refr+dv).r, texture2D(uTex,uv+refr).g, texture2D(uTex,uv+refr-dv).b);",
  "  tex = mix(tex, disp, 0.38 + isBevel*0.55);",
  "  float diff = 0.85 + 0.16*dot(No, normalize(vec3(-0.35,0.85,0.48)));",
  "  vec3 col = tex*vec3(0.88,0.915,0.965)*diff;",
  "  col = mix(col, vec3(0.84,0.88,0.935)*diff, uFrost*0.46);",
  "  float streak = pow(max(0.0, sin((vP.y*2.4+vP.z*1.9+N.x*2.5)*3.2+uTime*0.15)),14.0)*0.24*(1.0-uFrost);",
  "  float spec = pow(max(dot(reflect(-normalize(vec3(-0.4,0.8,0.6)),N), vec3(0.0,0.0,1.0)),0.0),30.0)*0.42;",
  "  col += streak + spec;",
  "  float rimShade = isBevel * smoothstep(0.0, 0.7, -No.z + No.x * 0.4);",
  "  col = mix(col, vec3(0.68,0.74,0.82), rimShade * 0.32);",
  "  col = mix(col, vec3(0.96,0.98,1.0), isBevel * (1.0 - rimShade) * 0.48);",
  "  col += (hash(gl_FragCoord.xy+7.0)-0.5)*0.015;",
  "  float al = (uBack>0.5) ? 0.35 : (0.78+0.15*uFrost);",
  "  gl_FragColor = vec4(col*al, al);",
  "}"
].join("\n");

var slabs = new Array(
  { x0: -1.00, x1: -0.45, y0: -1.00, y1: 1.00, z0: -1.00, z1: 1.00, frost: 0.74, grooved: 0.0 },
  { x0: -0.35, x1:  0.35, y0: -1.00, y1: 1.00, z0: -1.00, z1: 1.00, frost: 0.16, grooved: 0.0 },
  { x0:  0.45, x1:  1.00, y0: -1.00, y1: 1.00, z0: -1.00, z1: 1.00, frost: 0.44, grooved: 1.0 }
);

var group = new THREE.Group(); scene.add(group);
var meshes = new Array();
var passes = new Array(1, 0);

for (var i = 0; slabs.length > i; i++) {
  var s = slabs.at(i);
  var g = (s.grooved > 0.5)
    ? createExtrudedGroovedSlab(s.x0, s.x1, s.y0, s.y1, s.z0, s.z1, 0.068)
    : createFlatChamferedBox(s.x0, s.x1, s.y0, s.y1, s.z0, s.z1, 0.068);
  for (var p = 0; passes.length > p; p++) {
    var back = passes.at(p);
    var m = new THREE.ShaderMaterial({
      vertexShader: VERT, fragmentShader: FRAG,
      uniforms: {
        uMin: { value: new THREE.Vector3(s.x0, s.y0, s.z0) },
        uMax: { value: new THREE.Vector3(s.x1, s.y1, s.z1) },
        uFrost: { value: s.frost }, uBack: { value: back },
        uTime: uTime, uTex: uTex, uRes: uRes
      },
      transparent: true, depthWrite: false, depthTest: false,
      blending: THREE.CustomBlending, blendEquation: THREE.AddEquation,
      blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
      side: back ? THREE.BackSide : THREE.FrontSide
    });
    var mesh = new THREE.Mesh(g, m);
    mesh.userData.back = back;
    group.add(mesh);
    meshes.push(mesh);
  }
}

var userQ = new THREE.Quaternion(), swayQ = new THREE.Quaternion();
var X = new THREE.Vector3(1, 0, 0), Y = new THREE.Vector3(0, 1, 0);
var q1 = new THREE.Quaternion(), q2 = new THREE.Quaternion();
var dragging = false, lx = 0, ly = 0, vx = 0, vy = 0;
var el = renderer.domElement;

function spin(dx, dy) {
  q1.setFromAxisAngle(Y, dx); q2.setFromAxisAngle(X, dy);
  userQ.premultiply(q1).premultiply(q2);
}
el.addEventListener("pointerdown", function(e) { dragging = true; lx = e.clientX; ly = e.clientY; el.setPointerCapture(e.pointerId); });
el.addEventListener("pointermove", function(e) { if (!dragging) return; vx = (e.clientX - lx) * 0.008; vy = (e.clientY - ly) * 0.008; lx = e.clientX; ly = e.clientY; spin(vx, vy); });
el.addEventListener("pointerup", function() { dragging = false; });
el.addEventListener("pointercancel", function() { dragging = false; });
el.addEventListener("dblclick", function() { userQ.identity(); vx = vy = 0; });

function resize() {
  var w = innerWidth, h = innerHeight, a = w / h, s = 2.02;
  renderer.setSize(w, h);
  var db = renderer.getDrawingBufferSize(new THREE.Vector2());
  rt.setSize(db.x, db.y); uRes.value.copy(db);
  if (a >= 1) { cam.left = -s * a; cam.right = s * a; cam.top = s; cam.bottom = -s; }
  else { cam.left = -s; cam.right = s; cam.top = s / a; cam.bottom = -s / a; }
  cam.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

var clock = new THREE.Clock(), v = new THREE.Vector3(), inv = new THREE.Matrix4();
function loop() {
  var dt = clock.getDelta(); uTime.value += dt; var t = uTime.value;
  if (!dragging) { spin(vx, vy); vx *= 0.95; vy *= 0.95; }
  swayQ.setFromAxisAngle(Y, Math.sin(t * 0.45) * 0.22);
  group.quaternion.copy(swayQ).multiply(userQ);
  ballGroup.quaternion.copy(group.quaternion);

  ball.position.set(0.08 + 0.12 * Math.sin(t * 0.50), 0.04 + 0.10 * Math.sin(t * 0.70 + 1.0), 0.06 + 0.12 * Math.sin(t * 0.40 + 2.0));
  ball.rotation.set(t * 0.30, t * 0.40, t * 0.20);

  group.updateMatrixWorld(true); cam.updateMatrixWorld(true);
  inv.copy(cam.matrixWorld).invert();
  for (var i = 0; meshes.length > i; i++) {
    var m = meshes.at(i);
    m.geometry.boundingBox.getCenter(v);
    v.applyMatrix4(group.matrixWorld).applyMatrix4(inv);
    var k = Math.max(-300, Math.min(300, (v.z * 40) | 0));
    m.renderOrder = (m.userData.back ? -1000 : 0) + k;
  }

  renderer.setRenderTarget(rt); renderer.setClearColor(0xffffff, 1); renderer.clear();
  renderer.render(ballScene, cam);
  renderer.setRenderTarget(null);
  renderer.render(scene, cam);
  requestAnimationFrame(loop);
}
