<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2E8F0" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="#F8FAFC"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- ============ Document (hero, left) ============ -->
  <!-- shadow + back page -->
  <rect x="282" y="122" width="500" height="660" rx="8" fill="#0F172A" opacity="0.07"/>
  <rect x="296" y="136" width="500" height="660" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- front page -->
  <rect x="270" y="110" width="500" height="660" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- header bar -->
  <rect x="270" y="110" width="500" height="56" rx="8" fill="#1D4ED8"/>
  <rect x="270" y="150" width="500" height="16" fill="#1D4ED8"/>
  <!-- I-beam glyph -->
  <g fill="#FFFFFF">
    <rect x="298" y="126" width="36" height="6"/>
    <rect x="313" y="126" width="6" height="30"/>
    <rect x="298" y="150" width="36" height="6"/>
  </g>
  <rect x="348" y="132" width="180" height="6" rx="3" fill="#93C5FD"/>
  <circle cx="736" cy="138" r="9" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>

  <!-- title block -->
  <rect x="300" y="192" width="260" height="8" rx="4" fill="#0F172A"/>
  <rect x="300" y="210" width="170" height="6" rx="3" fill="#94A3B8"/>
  <rect x="660" y="188" width="80" height="26" rx="4" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <circle cx="674" cy="201" r="4" fill="#10B981"/>
  <rect x="686" y="198" width="40" height="5" rx="2.5" fill="#10B981"/>

  <!-- 3D cube viewport -->
  <rect x="300" y="240" width="440" height="230" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- isometric cube: T(520,300) L(440,340) R(600,340) C(520,380) BL(440,420) BR(600,420) B(520,460) -->
  <polygon points="520,300 600,340 520,380 440,340" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="440,340 520,380 520,460 440,420" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="600,340 520,380 520,460 600,420" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round"/>
  <!-- load arrow -->
  <line x1="520" y1="256" x2="520" y2="288" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  <polygon points="511,274 529,274 520,296" fill="#DC2626"/>

  <!-- data table -->
  <rect x="300" y="495" width="440" height="110" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="300" y1="532" x2="740" y2="532" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="300" y1="568" x2="740" y2="568" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="440" y1="495" x2="440" y2="605" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="590" y1="495" x2="590" y2="605" stroke="#E2E8F0" stroke-width="1.5"/>
  <g>
    <rect x="315" y="510" width="100" height="6" rx="3" fill="#94A3B8"/>
    <rect x="455" y="510" width="90" height="6" rx="3" fill="#94A3B8"/>
    <rect x="605" y="510" width="95" height="6" rx="3" fill="#94A3B8"/>
    <rect x="315" y="547" width="55" height="6" rx="3" fill="#0F172A"/>
    <rect x="455" y="547" width="75" height="6" rx="3" fill="#1D4ED8"/>
    <rect x="605" y="547" width="65" height="6" rx="3" fill="#10B981"/>
    <rect x="315" y="583" width="60" height="6" rx="3" fill="#0F172A"/>
    <rect x="455" y="583" width="85" height="6" rx="3" fill="#1D4ED8"/>
    <rect x="605" y="583" width="45" height="6" rx="3" fill="#0F172A"/>
  </g>

  <!-- QR + text lines -->
  <rect x="300" y="630" width="110" height="110" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <g stroke="#0F172A" stroke-width="3" fill="none">
    <rect x="310" y="640" width="26" height="26"/>
    <rect x="374" y="640" width="26" height="26"/>
    <rect x="310" y="704" width="26" height="26"/>
  </g>
  <g fill="#0F172A">
    <rect x="316" y="646" width="14" height="14"/>
    <rect x="380" y="646" width="14" height="14"/>
    <rect x="316" y="710" width="14" height="14"/>
    <rect x="348" y="642" width="8" height="8"/>
    <rect x="362" y="656" width="8" height="8"/>
    <rect x="346" y="672" width="10" height="8"/>
    <rect x="380" y="672" width="8" height="10"/>
    <rect x="348" y="690" width="8" height="8"/>
    <rect x="368" y="690" width="8" height="8"/>
    <rect x="352" y="712" width="12" height="8"/>
    <rect x="384" y="706" width="8" height="8"/>
    <rect x="366" y="724" width="8" height="8"/>
  </g>
  <rect x="386" y="688" width="8" height="8" fill="#1D4ED8"/>
  <g>
    <rect x="430" y="648" width="210" height="7" rx="3.5" fill="#0F172A"/>
    <rect x="430" y="670" width="170" height="6" rx="3" fill="#94A3B8"/>
    <rect x="430" y="690" width="190" height="6" rx="3" fill="#94A3B8"/>
    <rect x="430" y="710" width="120" height="6" rx="3" fill="#94A3B8"/>
    <rect x="430" y="730" width="150" height="6" rx="3" fill="#1D4ED8"/>
  </g>

  <!-- ============ Padlock badge (right, proportioned) ============ -->
  <circle cx="1184" cy="456" r="180" fill="#0F172A" opacity="0.05"/>
  <circle cx="1180" cy="450" r="180" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="1180" cy="450" r="150" fill="none" stroke="#DBEAFE" stroke-width="1"/>
  <circle cx="1180" cy="450" r="140" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-dasharray="6 10" opacity="0.8"/>
  <circle cx="1180" cy="310" r="8" fill="#10B981"/>
  <circle cx="1320" cy="450" r="8" fill="#1D4ED8"/>
  <circle cx="1180" cy="590" r="8" fill="#10B981"/>
  <circle cx="1040" cy="450" r="8" fill="#1D4ED8"/>
  <!-- shackle -->
  <path d="M 1130 400 v -30 a 50 50 0 0 1 100 0 v 30" fill="none" stroke="#0F172A" stroke-width="14" stroke-linecap="round"/>
  <!-- body -->
  <rect x="1105" y="395" width="150" height="130" rx="14" fill="#1D4ED8" stroke="#1E40AF" stroke-width="2"/>
  <!-- keyhole -->
  <circle cx="1180" cy="445" r="16" fill="#FFFFFF"/>
  <rect x="1174" y="452" width="12" height="26" rx="3" fill="#FFFFFF"/>
</svg>
