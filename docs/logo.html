<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spectral Glass Cube</title>
<style>
  html,body{margin:0;height:100%;background:#fff;overflow:hidden}
  canvas{display:block;cursor:grab;touch-action:none}
  canvas:active{cursor:grabbing}
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0xffffff,1);
document.body.appendChild(renderer.domElement);

const cam = new THREE.OrthographicCamera(-1,1,1,-1,0.1,60);
cam.position.set(7,7,7); cam.lookAt(0,0,0);
const scene = new THREE.Scene();       // glass
const ballScene = new THREE.Scene();   // living sphere -> offscreen buffer

const rt = new THREE.WebGLRenderTarget(4,4,{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter});
const uTime = {value:0};
const uRes  = {value:new THREE.Vector2(1,1)};
const uTex  = {value:rt.texture};

const BLEND = {
  transparent:true, depthWrite:false, depthTest:false,
  blending:THREE.CustomBlending, blendEquation:THREE.AddEquation,
  blendSrc:THREE.OneFactor, blendDst:THREE.OneMinusSrcAlphaFactor
};

/* ================= LIVING THERMAL SPHERE ================= */
const BALL_R = 1.30;
const ballMat = new THREE.ShaderMaterial({
  uniforms:{uTime, uR:{value:BALL_R}},
  vertexShader:`
    varying vec3 vView, vCenter, vObj;
    void main(){
      vObj = position;
      vec4 mv = modelViewMatrix*vec4(position,1.0);
      vView = mv.xyz;
      vCenter = (modelViewMatrix*vec4(0.0,0.0,0.0,1.0)).xyz;
      gl_Position = projectionMatrix*mv;
    }`,
  fragmentShader:`
    precision highp float;
    varying vec3 vView, vCenter, vObj;
    uniform float uTime, uR;
    vec3 ramp(float t){
      vec3 c0=vec3(1.00,0.40,0.52), c1=vec3(1.00,0.66,0.26), c2=vec3(1.00,0.96,0.30),
           c3=vec3(0.36,0.96,0.46), c4=vec3(0.22,0.90,1.00), c5=vec3(0.42,0.52,1.00), c6=vec3(0.80,0.58,1.00);
      t = clamp(t,0.0,1.0)*6.0;
      if(t<1.0) return mix(c0,c1,t);
      if(t<2.0) return mix(c1,c2,t-1.0);
      if(t<3.0) return mix(c2,c3,t-2.0);
      if(t<4.0) return mix(c3,c4,t-3.0);
      if(t<5.0) return mix(c4,c5,t-4.0);
      return mix(c5,c6,t-5.0);
    }
    void main(){
      vec2 q = (vView.xy - vCenter.xy)/uR;
      vec3 p = vObj/uR;
      float warp = 0.070*sin(p.x*3.0+p.y*2.0+uTime*0.7)
                 + 0.050*sin(p.y*4.0-p.z*3.0-uTime*0.6)
                 + 0.040*sin(p.z*5.0+p.x*2.0+uTime*0.9);
      float d = length(q) + warp;
      d -= 0.05*sin(uTime*1.1);                                   // breathing
      float t = d*1.0 + 0.08*sin(d*14.0 - uTime*1.6)*smoothstep(0.2,0.9,d); // flowing bands
      vec3 col = ramp(t);
      col = mix(col, ramp(fract(d*2.2 + 0.1 - uTime*0.03)), 0.18*smoothstep(0.3,0.9,d));
      col = mix(col, vec3(1.0), 0.08);
      col = mix(col, vec3(1.0,0.97,0.95), 0.28*exp(-d*d*9.0)*(0.6+0.4*sin(uTime*2.0))); // hot core pulse
      float a = smoothstep(1.02,0.52,d)*0.98;
      gl_FragColor = vec4(col*a, a);
    }`,
  ...BLEND
});
const ballGroup = new THREE.Group();
ballScene.add(ballGroup);
const ball = new THREE.Mesh(new THREE.SphereGeometry(BALL_R,64,48), ballMat);
ballGroup.add(ball);

/* ================= FROSTED GLASS SLABS ================= */
const VERT=`
varying vec3 vP, vNv, vNo;
void main(){
  vP = position; vNo = normal;
  vNv = normalize(normalMatrix*normal);
  gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);
}`;

const FRAG=`
precision highp float;
varying vec3 vP, vNv, vNo;
uniform vec3 uMin, uMax; uniform float uFrost, uBack, uTime;
uniform sampler2D uTex; uniform vec2 uRes;
float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
void main(){
  vec2 uv = gl_FragCoord.xy/uRes;
  vec3 N  = normalize(vNv); if(!gl_FrontFacing) N = -N;
  vec3 No = normalize(vNo); if(!gl_FrontFacing) No = -No;

  vec3 a=vP-uMin, b=uMax-vP;
  vec3 d=vec3(min(a.x,b.x),min(a.y,b.y),min(a.z,b.z));
  float lo=min(d.x,min(d.y,d.z)), hi=max(d.x,max(d.y,d.z));
  float e2=d.x+d.y+d.z-lo-hi;
  float edge =1.0-smoothstep(0.0,0.07,e2);
  float bevel=1.0-smoothstep(0.0,0.022,e2);

  // refraction: shifts what you see through each face, plus slow liquid ripple on clear glass
  vec2 refr = N.xy*(uBack>0.5 ? -0.02 : 0.04)
            + 0.010*(1.0-uFrost)*vec2(sin(vP.y*7.0+uTime*0.6+N.x*3.0), cos(vP.z*6.0-uTime*0.5+N.y*3.0));

  // frosted blur of the sphere buffer (radius depends on plate frost)
  float rad = mix(0.006,0.07,uFrost);
  vec2 asp = vec2(uRes.y/uRes.x,1.0);
  float j = hash(gl_FragCoord.xy)*6.2832;
  vec3 acc = vec3(0.0);
  for(int i=0;i<14;i++){
    float fi=float(i);
    float r=sqrt((fi+0.5)/14.0)*rad;
    float an=fi*2.39996+j;
    acc += texture2D(uTex, uv+refr+vec2(cos(an),sin(an))*r*asp).rgb;
  }
  vec3 tex = acc/14.0;

  // chromatic dispersion on the bevels
  vec2 dv = N.xy*0.03*edge;
  vec3 disp = vec3(texture2D(uTex,uv+refr+dv).r, texture2D(uTex,uv+refr).g, texture2D(uTex,uv+refr-dv).b);
  tex = mix(tex, disp, edge*0.5);

  float diff = 0.90 + 0.12*dot(No, normalize(vec3(-0.3,0.85,0.45)));
  vec3 col = tex*vec3(0.93,0.955,0.985)*diff;
  col = mix(col, vec3(0.93,0.95,0.98)*diff, uFrost*0.35);

  float streak = pow(max(0.0, sin((vP.y*2.4+vP.z*1.9+N.x*2.5)*3.2+uTime*0.15)),14.0)*0.22*(1.0-uFrost);
  float spec = pow(max(dot(reflect(-normalize(vec3(-0.4,0.8,0.6)),N), vec3(0.0,0.0,1.0)),0.0),30.0)*0.40;
  col += streak + spec;

  col = mix(col, vec3(1.0), edge*0.50 + bevel*0.35);
  col += (hash(gl_FragCoord.xy+7.0)-0.5)*0.016;

  float al = (uBack>0.5) ? 0.55 : (0.80+0.15*uFrost);
  gl_FragColor = vec4(col*al, al);
}`;

// [x0,x1,y0,y1,z0,z1, frost]  higher frost = milkier + blurrier
const slabs=[
  [-1.00,-0.38,-1.00, 1.00,-1.00,1.00, 0.70],  // left plate
  [-0.27, 0.31,-0.97, 0.93,-0.95,1.00, 0.26],  // middle plate (clearest)
  [ 0.42, 1.00, 0.40, 1.00,-1.00,1.00, 0.48],  // right top bar
  [ 0.42, 1.00,-0.30, 0.30,-0.98,0.98, 0.28],  // right middle bar
  [ 0.42, 1.00,-1.00,-0.40,-1.00,1.00, 0.68]   // right bottom bar
];

const group = new THREE.Group(); scene.add(group);
const meshes=[];
for(const [x0,x1,y0,y1,z0,z1,f] of slabs){
  const g=new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0);
  g.translate((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);
  g.computeBoundingBox();
  for(const back of [1,0]){
    const m=new THREE.ShaderMaterial({
      vertexShader:VERT, fragmentShader:FRAG,
      uniforms:{
        uMin:{value:new THREE.Vector3(x0,y0,z0)}, uMax:{value:new THREE.Vector3(x1,y1,z1)},
        uFrost:{value:f}, uBack:{value:back}, uTime, uTex, uRes
      },
      ...BLEND, side: back?THREE.BackSide:THREE.FrontSide
    });
    const mesh=new THREE.Mesh(g,m); mesh.userData.back=back;
    group.add(mesh); meshes.push(mesh);
  }
}

/* ================= INTERACTION ================= */
const userQ = new THREE.Quaternion(), swayQ = new THREE.Quaternion();
const X=new THREE.Vector3(1,0,0), Y=new THREE.Vector3(0,1,0);
const q1=new THREE.Quaternion(), q2=new THREE.Quaternion();
let dragging=false,lx=0,ly=0,vx=0,vy=0;
const el=renderer.domElement;
function spin(dx,dy){
  q1.setFromAxisAngle(Y,dx); q2.setFromAxisAngle(X,dy);
  userQ.premultiply(q1).premultiply(q2);
}
el.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;el.setPointerCapture(e.pointerId);});
el.addEventListener('pointermove',e=>{if(!dragging)return;vx=(e.clientX-lx)*0.008;vy=(e.clientY-ly)*0.008;lx=e.clientX;ly=e.clientY;spin(vx,vy);});
el.addEventListener('pointerup',()=>dragging=false);
el.addEventListener('pointercancel',()=>dragging=false);
el.addEventListener('dblclick',()=>{userQ.identity();vx=vy=0;});

function resize(){
  const w=innerWidth,h=innerHeight,a=w/h,s=2.45;
  renderer.setSize(w,h);
  const db=renderer.getDrawingBufferSize(new THREE.Vector2());
  rt.setSize(db.x,db.y); uRes.value.copy(db);
  if(a>=1){cam.left=-s*a;cam.right=s*a;cam.top=s;cam.bottom=-s;}
  else{cam.left=-s;cam.right=s;cam.top=s/a;cam.bottom=-s/a;}
  cam.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();

/* ================= LOOP ================= */
const clock=new THREE.Clock(), v=new THREE.Vector3(), inv=new THREE.Matrix4();
function loop(){
  const dt=clock.getDelta(); uTime.value+=dt; const t=uTime.value;

  if(!dragging){ spin(vx,vy); vx*=0.95; vy*=0.95; }
  swayQ.setFromAxisAngle(Y, Math.sin(t*0.45)*0.30);           // gentle idle sway
  group.quaternion.copy(swayQ).multiply(userQ);
  ballGroup.quaternion.copy(group.quaternion);

  // living sphere: drifts inside the cube and tumbles so the plasma churns
  ball.position.set(0.10+0.14*Math.sin(t*0.50), 0.05+0.12*Math.sin(t*0.70+1.0), 0.14*Math.sin(t*0.40+2.0));
  ball.rotation.set(t*0.30, t*0.40, t*0.20);

  group.updateMatrixWorld(true); cam.updateMatrixWorld(true);
  inv.copy(cam.matrixWorld).invert();
  for(const m of meshes){
    m.geometry.boundingBox.getCenter(v);
    v.applyMatrix4(group.matrixWorld).applyMatrix4(inv);
    const k=Math.max(-300,Math.min(300,(v.z*40)|0));          // far -> near
    m.renderOrder=(m.userData.back?-1000:0)+k;
  }

  // pass 1: sphere into buffer, pass 2: glass samples it
  renderer.setRenderTarget(rt); renderer.setClearColor(0xffffff,1); renderer.clear();
  renderer.render(ballScene,cam);
  renderer.setRenderTarget(null);
  renderer.render(scene,cam);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
